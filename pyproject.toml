[project]
name = "tageveryonetelegrambot"
version = "2.0.0"
description = "This bot allows you to **mention all users in a group**. Users who wish to receive these notifications will have to sign up using the `/in` command."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.5",
    "celery[redis]>=5.6.3",
    "cryptography>=47.0.0",
    "fastapi[standard]>=0.128.8",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "pydantic>=2.12.5",
    "pydantic-core>=2.41.5",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.5",
    "ruff>=0.15.15",
    "sentry-sdk[flask]>=2.51.0",
    "sqlalchemy>=2.0.46",
    "sqlmodel>=0.0.34",
    "werkzeug>=3.1.5",
]

[tool.ruff]
target-version = "py314"
exclude = [
    "alembic",
    ".venv",
    "venv",
    "src/db/migrations",
    "__cache_",
    "__pycache__",
    "__init__.py",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "E712",  # Allow equality comparisons to True (needed for SQLAlchemy queries)
    "E402",  # Allow module level imports not at the top of the file (for type checking imports)
]
