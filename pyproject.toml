[project]
name = "tageveryonetelegrambot"
version = "2.0.0"
description = "This bot allows you to **mention all users in a group**. Users who wish to receive these notifications will have to sign up using the `/in` command."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.5",
    "celery>=5.6.3",
    "cryptography>=47.0.0",
    "fastapi[standard]>=0.128.8",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "pydantic>=2.12.5",
    "pydantic-core>=2.41.5",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.5",
    "ruff>=0.15.15",
    "sentry-sdk[flask]>=2.51.0",
    "sqlalchemy>=2.0.46",
    "sqlmodel>=0.0.34",
    "werkzeug>=3.1.5",
]

[tool.ruff]
target-version = "py314"
exclude = [
    "alembic",
    ".venv",
    "venv",
    "src/db/db_migrations",
    "__cache_",
    "__pycache__",
    "__init__.py",
]
