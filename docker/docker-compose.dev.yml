name: tageveryone-v2

services:
  # --- Infrastructure ---
  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-tageveryone_redis_password}
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD:-tageveryone_redis_password}
    volumes:
      - redis_data:/data
    networks:
      - network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MARIADB_USER: ${MYSQL_USER:-tageveryone_bot}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-tageveryone_bot_password}
      MARIADB_DATABASE: ${MYSQL_DB:-tageveryone_bot}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 50M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - network

  # --- Application Services ---
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - DB_TYPE=${DB_TYPE:-mysql}
      - MYSQL_SERVER=${MYSQL_SERVER:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-tageveryone_bot}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-tageveryone_bot_password}
      - MYSQL_DB=${MYSQL_DB:-tageveryone_bot}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-tageveryone_redis_password}
      - REDIS_CELERY_DB=${REDIS_CELERY_DB:-0}
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-1}
    volumes:
      - db_data:/app/src/db/input
    networks:
      - network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "api/main.py"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - DB_TYPE=${DB_TYPE:-mysql}
      - MYSQL_SERVER=${MYSQL_SERVER:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-tageveryone_bot}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-tageveryone_bot_password}
      - MYSQL_DB=${MYSQL_DB:-tageveryone_bot}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-tageveryone_redis_password}
      - REDIS_CELERY_DB=${REDIS_CELERY_DB:-0}
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-1}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - db_data:/app/src/db/input
    networks:
      - network

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "celery_workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - DB_TYPE=${DB_TYPE:-mysql}
      - MYSQL_SERVER=${MYSQL_SERVER:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-tageveryone_bot}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-tageveryone_bot_password}
      - MYSQL_DB=${MYSQL_DB:-tageveryone_bot}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-tageveryone_redis_password}
      - REDIS_CELERY_DB=${REDIS_CELERY_DB:-0}
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-1}
    volumes:
      - db_data:/app/src/db/input
    networks:
      - network

  webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webapp
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_BOT_USERNAME=${VITE_BOT_USERNAME}
      - VITE_API_URL=${VITE_API_URL}
    networks:
      - network

volumes:
  redis_data:
  mysql_data:
  db_data:

networks:
  network:
    driver: bridge
